name: Build image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # first day of month, 5:03 UTC (matches CircleCI monthly rebuild)
    - cron: '3 5 1 * *'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: texlive-pdflatex

jobs:
  build:
    name: Build image (${{ matrix.alpine_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        alpine_version: [alpine-3.16, alpine-3.17, latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
        if: github.event_name != 'pull_request'

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.alpine_version }}
            type=raw,value=${{ matrix.alpine_version }}-latest
            type=sha
            type=raw,value=${{ matrix.alpine_version }}-{{date 'YYYYMMDD'}}

      - name: Build single-platform image for testing
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg ALPINE_VERSION=${{ matrix.alpine_version }} \
            -t ${{ env.REGISTRY }}/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ matrix.alpine_version }} \
            --load \
            .

      - name: Test pdflatex version
        run: docker run --rm ${{ env.REGISTRY }}/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ matrix.alpine_version }} pdflatex -version

      - name: Test full compile cycle
        if: matrix.alpine_version == 'latest'
        run: |
          # build a dummy data volume container for the example files
          docker create -v /data --name example_data busybox /bin/true
          docker cp example/loreipsum.tex example_data:/data
          # compile → thumbnail → re-compile (same sequence as CircleCI)
          docker run --rm --volumes-from example_data ${{ env.REGISTRY }}/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ matrix.alpine_version }} pdflatex /data/loreipsum.tex
          docker run --rm --volumes-from example_data ${{ env.REGISTRY }}/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ matrix.alpine_version }} sh -c 'thumbpdf /data/loreipsum.pdf'
          docker run --rm --volumes-from example_data ${{ env.REGISTRY }}/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ matrix.alpine_version }} pdflatex /data/loreipsum.tex

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine_version }}
