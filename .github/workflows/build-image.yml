name: Build image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # daily rebuild so base images and dependencies stay current
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: texlive-pdflatex

jobs:
  build:
    name: Build image (${{ matrix.alpine_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        alpine_version: [latest, alpine-3.15]
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name != 'pull_request'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
        if: github.event_name != 'pull_request'

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.alpine_version }}
            type=raw,value=${{ matrix.alpine_version }}-latest
            type=sha
            type=raw,value=${{ matrix.alpine_version }}-{{date 'YYYYMMDD'}}

      - name: Build single-platform image for testing
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg ALPINE_VERSION=${{ matrix.alpine_version }} \
            -t ${{ env.REGISTRY }}/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ matrix.alpine_version }} \
            --load \
            .

      - name: Test pdflatex version
        run: docker run --rm ${{ env.REGISTRY }}/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ matrix.alpine_version }} pdflatex -version

      - name: Test document compilation
        if: matrix.alpine_version == 'latest'
        run: |
          docker run --rm -v ${{ github.workspace }}/example:/data ${{ env.REGISTRY }}/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest pdflatex /data/loreipsum.tex

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine_version }}
